<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }
      .send-button {
        background-color: rgb(25, 135, 84);
        padding: 12px 20px;
        border-radius: 10px;
        border: none;
        margin-left: 10px;
        font-size: 15px;
        color: white;
        cursor: pointer;
      }
      .send-button:hover{
        background-color: rgb(21, 114, 71);
      }
      .input-textbox {
        border-radius: 10px;
        border-width: 1px;
        text-align: left;
        padding: 12px 15px;
        flex-grow: 1;
      }
      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }
      .app-container {
        max-width: 600px;
        height: 100vh;
        display: flex;
        flex-direction: column;

        margin-left: auto;
        margin-right: auto;
      }
      .chat-message-user {
        display: flex;
        align-items: start;
        justify-content: end;
      }
      .chat-message-robot {
        display: flex;
        align-items: start;
      }
      .chat-message-text {
        background-color:rgb(226, 223, 223);
        font-size: 15px;
        align-items: center;
        padding: 15px;
        margin-left: 10px;
        margin-right: 10px;
        border-radius: 10px;
        vertical-align: auto;
        margin-bottom: 20px;
        max-width: 300px;
      }
      .chat-message-profile {
        width: 45px;
      }
      .chat-messages-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
      .empty-chat-message {
        text-align: center;
        color: grey;
      }
      .loading-container {
        background: rgb(226, 223, 223);
        font-size: 15px;
        align-items: center;
        padding: 5px;
        margin-left: 5px;
        margin-right: 10px;
        border-radius: 10px;
        vertical-align: auto;
        margin-bottom: 20px;
        max-width: 300px;
      }
      .loading-spinner {
        width: 30px;
        height: 30px;
        height: 40px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="react-basics.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
        function ChatInput({ chatMessages, setChatMessages, isLoading, setIsLoading }){
          const [inputText, setInputText] = React.useState('');
          

          function saveInputText(event) {
            setInputText(event.target.value);
          }

          async function sendMessage() {
            const message = inputText;
            setInputText('');
            setIsLoading(true);

            const newChatMessages = [
              ...chatMessages,
              {
                message: message,
                sender: 'user',
                id: crypto.randomUUID()
              }
            ];

            setChatMessages(newChatMessages);

            const response = await(Chatbot.getResponseAsync(message));
            setIsLoading(false);

            setChatMessages([
              ...newChatMessages,
              {
                message: response,
                sender: 'robot',
                id: crypto.randomUUID()
              }
            ]);
            
            
            
          }

          function keyHandler(event){
            if(event.key === "Enter" && inputText.trim() !== ""){
              sendMessage();
            }else if(event.key === "Escape"){
              setInputText("");
            }
          }

          return (
            <div className="chat-input-container">
              <input 
                placeholder="Send a message to Chatbot" 
                onChange={saveInputText}
                onKeyDown={keyHandler}
                value={inputText}
                className="input-textbox"
              />
              <button 
              onClick={sendMessage}
              className="send-button"
              disabled={isLoading || inputText.trim() === ""}
              >Send</button>
            </div>
          );
        }

        function ChatMessage({message, sender, isLoading=false}){
          // console.log(props)

          // const message = props.message;
          // const sender = props.sender;

          // const {message, sender} = props;

          // if(sender === "robot"){
          //   return (
          //     <div>
          //       <img src="robot.png" width="50" alt="robot.png" />
          //       {message}
          //     </div>
          // );
          // }

          return (
            <div className={
              sender === "user"
              ? 'chat-message-user' 
              : 'chat-message-robot'
            }>
              {sender === "robot" && (
                <img src="robot.png" className="chat-message-profile" alt="robot.png" />
              )}
              {isLoading ? (
                <div className="loading-container">
                  <img className= "loading-spinner" src="https://supersimple.dev/images/loading-spinner.gif" alt="Loading..." />
                </div>
              ):(
                <div className="chat-message-text">
                    {message}
                </div>
              )}
              {sender === "user" && (
                <img src="user.png" className="chat-message-profile" alt="user.png" />
              )}
            </div>
          );
        }

        function useAutoScroll(dependencies){
          const containerRef = React.useRef(null);

          React.useEffect(() => {
            const containerElem = containerRef.current;
            if (containerElem) {
              containerElem.scrollTop = containerElem.scrollHeight;
            }
          }, dependencies);

        }

        function ChatMessages({ chatMessages, isLoading }){
          const chatMessagesRef = useAutoScroll([chatMessages, isLoading]);
        
          
          // const [chatMessages, setChatMessages] = array;
          
          // const chatMessages = array[0];
          // const setChatMessages = array[1];

        return (
          <div 
            className="chat-messages-container" 
            ref={chatMessagesRef}
          >
            {chatMessages.map((chatMessage) => {
              return (
                      <ChatMessage 
                        message = {chatMessage.message}
                        sender = {chatMessage.sender}
                        key = {chatMessage.id}
                      />
                    );
                  })}

                  {isLoading && (
                    <ChatMessage 
                      message="Loading..."
                      sender="robot"
                      isLoading={isLoading}
                    />
                  )}
                  
          </div>
        );}

        function WelcomeMessage({ chatMessages }){
          return(
            <>
              {chatMessages.length === 0 && (
                <p className="empty-chat-message">
                  Welcome to the chatbot project! Send a message using the textbox below
                  </p>
              )}
            </>
          );
        }

        function App() {
          const [chatMessages, setChatMessages] = React.useState([]);
          const [isLoading, setIsLoading] = React.useState(false);

          return (
            <div className="app-container">
              < WelcomeMessage chatMessages={chatMessages}/>
              <ChatMessages 
              chatMessages={chatMessages}
              isLoading={isLoading}
              />
              <ChatInput 
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
              isLoading={isLoading}
              setIsLoading={setIsLoading}
              />
              </div>
          );
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
