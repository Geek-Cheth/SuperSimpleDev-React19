<!DOCTYPE html>
<html>
  <head>
    <title>State and Event Handlers.</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .login-container{
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }
        .login-input-container{
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
            max-width: 300px;
            width: 90%;
            
        }
        .login-input-container input{
            font-size: 15px;
            padding: 10px;
            width: 100%;
        }
        .login-button-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
        }
        .login-button-container button{
            font-size: 15px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            background-color: rgba(20, 20, 20, 0.699);
        }
        .Password-container{
            display: flex;
            width: 100%;
        }
        .Password-container button{
            width: 40px;
        }
        .Password-container input{
            flex: 1;
            width: 0;
            min-width: 0;
        }
    </style>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="react-basics.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
        function LoginField(){
            const [passwordType, setPasswordType] = React.useState(true)
            function passwordToggle(){
                setPasswordType(!passwordType);
            }
            return(
                <div className="login-container">
                    <div className="login-input-container">
                        <input type="email" placeholder="Email" />
                        <div className="Password-container">
                            <input type={passwordType? "text":"password"} placeholder="Password" />
                            <button 
                                onClick = {passwordToggle}
                                className={`password-button`}> 
                                    {passwordType? "👁" : "🙈"}
                            </button>
                        </div>
                    </div>
                    <div className="login-button-container">
                        <button>Login</button>
                        <button>Sign up</button>
                    </div>
                </div>
            )
        }
        function App(){
          return(
            <LoginField />
          )
        }
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html
